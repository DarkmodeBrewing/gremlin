services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: gremlin
      POSTGRES_USER: gremlin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gremlin-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gremlin -d gremlin"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  migrate:
    build:
      context: .
      dockerfile: apps/prime/Dockerfile
    command: ["node", "apps/prime/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://gremlin:${POSTGRES_PASSWORD:-gremlin-dev}@postgres:5432/gremlin
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gremlin-prime:
    build:
      context: .
      dockerfile: apps/prime/Dockerfile
    environment:
      BACKGROUND_CONSOLIDATION_ENABLED: ${BACKGROUND_CONSOLIDATION_ENABLED:-false}
      CONSOLIDATION_BATCH_SIZE: ${CONSOLIDATION_BATCH_SIZE:-20}
      CONSOLIDATION_MAX_ATTEMPTS: ${CONSOLIDATION_MAX_ATTEMPTS:-3}
      CONSOLIDATION_MAX_SOURCE_CHARACTERS: ${CONSOLIDATION_MAX_SOURCE_CHARACTERS:-200000}
      CONSOLIDATION_MODEL: ${CONSOLIDATION_MODEL:-}
      CONSOLIDATION_POLL_INTERVAL_MS: ${CONSOLIDATION_POLL_INTERVAL_MS:-60000}
      CONSOLIDATION_PRINCIPAL_ID: ${CONSOLIDATION_PRINCIPAL_ID:-system:consolidator}
      CONSOLIDATION_PROVIDER: openrouter
      CONSOLIDATION_RETRY_DELAY_MS: ${CONSOLIDATION_RETRY_DELAY_MS:-300000}
      DATABASE_URL: postgres://gremlin:${POSTGRES_PASSWORD:-gremlin-dev}@postgres:5432/gremlin
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_PROVIDER: openrouter
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MODEL_REQUEST_TIMEOUT_MS: ${MODEL_REQUEST_TIMEOUT_MS:-60000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "${HTTP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  gremlin-chat:
    build:
      context: .
      dockerfile: apps/chat/Dockerfile
    environment:
      DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-}
      GREMLIN_CHAT_API_KEY: ${GREMLIN_CHAT_API_KEY:-}
      GREMLIN_PRIME_URL: http://gremlin-prime:3000
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MEMORY_CONTEXT_MAX_TOKENS: ${MEMORY_CONTEXT_MAX_TOKENS:-1200}
      MEMORY_SEARCH_LIMIT: ${MEMORY_SEARCH_LIMIT:-5}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "127.0.0.1:${CHAT_HTTP_PORT:-3001}:3001"
    depends_on:
      gremlin-prime:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
